# Proxy headers IPTV Hub needs in order to know its real public URL.
# A standalone file, included only by our own site file; nothing else is affected.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";

# 302 redirects to the upstream server must reach the player untouched
proxy_redirect off;
proxy_buffering off;
proxy_request_buffering off;

proxy_connect_timeout 15s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
