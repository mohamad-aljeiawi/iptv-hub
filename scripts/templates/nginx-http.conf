# IPTV Hub — a fully standalone file. It modifies no other site on this server.
# This is the pre-certificate version (HTTP only), also used with --no-ssl.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/iptv-hub.access.log;
    error_log  /var/log/nginx/iptv-hub.error.log;

    # Let's Encrypt validation path
    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type "text/plain";
    }

    # Protect the login form against password guessing
    location = /api/login {
        limit_req zone=iptvhub_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/iptv-hub-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/iptv-hub-proxy.conf;
    }
}
