# IPTV Hub — a fully standalone file. It modifies no other site on this server.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/iptv-hub.access.log;
    error_log  /var/log/nginx/iptv-hub.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
        default_type "text/plain";
    }

    # Important: player paths are served over HTTP as-is, with no HTTPS redirect.
    # Some players (ExoPlayer-based ones in particular) refuse cross-protocol
    # redirects, so forcing an https link onto an http stream breaks playback.
    # The same goes for the in-browser watch page (/watch/, /w/): an HTTPS page
    # cannot play the providers' HTTP streams.
    location ~ ^/(player_api\.php|panel_api\.php|get\.php|xmltv\.php|live/|movie/|series/|watch/|w/) {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/iptv-hub-proxy.conf;
    }

    # The web interface itself redirects to HTTPS as normal.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # This http2 form is accepted by nginx 1.18 through 1.27 (newer versions only
    # print a deprecation warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:iptvhub_ssl:5m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/iptv-hub.access.log;
    error_log  /var/log/nginx/iptv-hub.error.log;

    location = /api/login {
        limit_req zone=iptvhub_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/iptv-hub-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include /etc/nginx/iptv-hub-proxy.conf;
    }
}
