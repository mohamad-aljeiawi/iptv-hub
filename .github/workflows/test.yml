name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.16.0 is the floor: earlier 22.x releases ship SQLite without FTS5.
        node: ['22.16.0', '22.x', '24.x']
        include:
          - os: windows-latest
            node: '22.x'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning install.sh deploy.sh scripts/install.sh scripts/iptvhub

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.yml
        run: docker compose config --quiet
      - name: Build
        run: docker build -t iptv-hub:ci .
      - name: Tests inside the image (in-browser playback needs its ffmpeg)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo iptv-hub:ci node --no-warnings --test test/*.test.js
      - name: Smoke test
        run: |
          docker run -d --name ci -p 127.0.0.1:18000:8080 -e ADMIN_TOKEN=ci iptv-hub:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18000/player_api.php && break; sleep 1; done
          curl -fsS "http://127.0.0.1:18000/player_api.php?username=admin&password=ci" | grep -q '"auth":1'
          docker logs ci
